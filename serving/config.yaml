# Serving configuration for the resume-screener retrieval service.
#
# All settings can be overridden with environment variables (env wins over
# this file). Names follow the SCREENER_ prefix convention:
#
#   SCREENER_ARTIFACT_DIR   -> artifact_dir
#   SCREENER_MODEL_PATH     -> model_path      (overrides artifact_dir/biencoder.pt)
#   SCREENER_TOP_K_DEFAULT  -> top_k_default
#   SCREENER_TOP_K_MAX      -> top_k_max
#   SCREENER_HOST           -> host
#   SCREENER_PORT           -> port
#   SCREENER_WORKERS        -> workers
#   SCREENER_SEED           -> seed

artifact_dir: "../artifacts"     # resolved relative to serving/, unless absolute
model_path: null                 # explicit biencoder.pt override (null = artifact_dir/biencoder.pt)
top_k_default: 10
top_k_max: 100
host: "127.0.0.1"
port: 8000
workers: 1
seed: 42
torch_threads: 1                 # deterministic serving: single-threaded matmuls
